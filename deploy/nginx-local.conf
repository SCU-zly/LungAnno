# CT 标注系统生产 nginx（本机 :8080）
# 用法：docker compose up -d web（见 deploy/README.md）
# 托管 frontend/dist 静态产物 + /api 反代到本机 uvicorn(:8000)
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip：nii.gz 已是压缩格式，无需再压（application/gzip 不在列表中）
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;
    gzip_vary on;

    # 带 hash 指纹的静态资源：长缓存（vite 构建产物文件名含内容哈希）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API 反代：/api/xxx → 127.0.0.1:8000/xxx（nginx 以 host 网络模式运行）
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # volume 文件大（几十~几百 MB），放宽超时与缓冲
        proxy_read_timeout 600s;
        proxy_buffering on;
        client_max_body_size 100m;
    }

    # SPA 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头（将来上 HTTPS 后取消注释 COOP/COEP 可恢复 SharedArrayBuffer 真身）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # add_header Cross-Origin-Opener-Policy same-origin always;
    # add_header Cross-Origin-Embedder-Policy require-corp always;
}
